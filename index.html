<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home – APMD</title>
    <meta name="description" content="APMD Lab" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <script src="scripts/components.js"></script>

    <site-header></site-header>

    <main class="page-container">
      <section class="hero">
        <div class="hero__spotlight" aria-hidden="true"></div>
        <div class="hero__content">
          <h1 class="hero__title">
            LIGHT,<br />
            PROGRAMMED<span class="hero__title-dot">.</span>
          </h1>
          <p class="hero__subtitle">
            Metasurfaces and metamaterials engineered at KAIST—<br />
            drag your cursor to excite the lattice.
          </p>
        </div>
      </section>

      <section class="home-news">
        <div class="home-news__inner">
          <div class="page-title-container">
            <h2 class="page-title">News<span class="page-title__dot">.</span></h2>
          </div>

          <div class="news-grid" data-news-grid></div>
        </div>
      </section>

      <site-footer></site-footer>
    </main>

    <script src="scripts/news-data.js"></script>
    <script src="scripts/news-render.js"></script>
    <script src="scripts/script.js"></script>
  </body>
</html>
