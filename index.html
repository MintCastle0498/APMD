<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home – APMD</title>
    <meta name="description" content="APMD Lab" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="assets/favicon/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <!-- The light-convergence intro (hero-intro.js) is gated entirely on
       this class — removing it here is the actual "off switch": every
       CSS rule keyed on body.hero-intro stops applying (so the header/
       hero content/spotlight just render normally, immediately), and
       hero-intro.js's own top-level check on this class turns its whole
       script into a no-op. Nothing else needs to change to re-enable it
       later — just add "hero-intro" back. -->
  <body>
    <script src="scripts/components.js"></script>

    <site-header></site-header>

    <main class="page-container">
      <section class="hero">
        <div class="hero__spotlight" aria-hidden="true"></div>
        <!-- A burst of small lights flies in and converges here before the
             header/title reveal — see hero-intro.js. Only index.html's
             <body> carries the "hero-intro" class this all keys off of
             (styles.css), so every other page's header/hero keeps its
             normal, immediate entrance. -->
        <div class="hero__intro-lights" data-hero-intro aria-hidden="true"></div>
        <div class="hero__content">
          <h1 class="hero__title">
            LIGHT,<br />
            PROGRAMMED<span class="hero__title-dot">.</span>
          </h1>
          <p class="hero__subtitle">
            Metasurfaces and metamaterials engineered at KAIST<br />
            Advanced Photonic Materials and Devices Lab
          </p>
        </div>

        <a href="#application-areas" class="hero-scroll-cue" aria-label="Scroll to content">
          <span class="hero-scroll-cue__icon" aria-hidden="true">
            <span class="hero-scroll-cue__chevron"></span>
          </span>
        </a>
      </section>

      <section class="application-areas" id="application-areas">
        <div class="application-areas__inner">
          <div class="page-title-container">
            <h2 class="page-title">Research Applications<span class="page-title__dot">.</span></h2>
          </div>

          <div class="application-grid">
            <button
              type="button"
              class="application-card"
              style="--app-photo: url('assets/applications/optical-semiconductors.jpg')"
            >
              <span class="application-card__bg" aria-hidden="true"></span>
              <span class="application-card__scrim" aria-hidden="true"></span>
              <span class="application-card__glass">
                <span class="application-card__title">Optical Semiconductors</span>
                <span class="application-card__desc"
                  >Metasurface-integrated photonic components that bring on-chip light control to
                  semiconductor devices, from beam steering to wavelength-selective filtering.</span
                >
              </span>
            </button>

            <button
              type="button"
              class="application-card"
              style="--app-photo: url('assets/applications/co-packaged-optics.jpg')"
            >
              <span class="application-card__bg" aria-hidden="true"></span>
              <span class="application-card__scrim" aria-hidden="true"></span>
              <span class="application-card__glass">
                <span class="application-card__title">Co-Packaged Optics</span>
                <span class="application-card__desc"
                  >Ultra-compact metasurface optics packaged directly alongside electronic chips,
                  enabling the dense, low-loss optical interconnects next-generation data centers
                  need.</span
                >
              </span>
            </button>

            <button
              type="button"
              class="application-card"
              style="--app-photo: url('assets/applications/quantum-applications.jpg')"
            >
              <span class="application-card__bg" aria-hidden="true"></span>
              <span class="application-card__scrim" aria-hidden="true"></span>
              <span class="application-card__glass">
                <span class="application-card__title">Quantum Applications</span>
                <span class="application-card__desc"
                  >Structured-light metasurfaces for generating and manipulating entangled photon
                  states, toward compact building blocks for quantum communication and sensing.</span
                >
              </span>
            </button>

            <button
              type="button"
              class="application-card"
              style="--app-photo: url('assets/applications/display-technology.jpg')"
            >
              <span class="application-card__bg" aria-hidden="true"></span>
              <span class="application-card__scrim" aria-hidden="true"></span>
              <span class="application-card__glass">
                <span class="application-card__title">Display Technology</span>
                <span class="application-card__desc"
                  >Nanostructured color and holographic metasurfaces for ultra-thin displays and
                  augmented-reality optics, in place of bulky conventional optical stacks.</span
                >
              </span>
            </button>
          </div>
        </div>
      </section>

      <section class="home-news" id="home-news">
        <div class="home-news__inner">
          <div class="page-title-container">
            <h2 class="page-title">Latest News<span class="page-title__dot">.</span></h2>
          </div>

          <a class="recruit-banner" href="contact.html">
            <span class="recruit-banner__text">2027년 봄학기 신입생 모집중</span>
            <svg class="recruit-banner__chevron" width="7" height="11" viewBox="0 0 7 11" fill="none" aria-hidden="true">
              <path d="M1 1L6 5.5L1 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>

          <div class="news-grid" data-news-grid></div>
        </div>
      </section>

      <site-footer></site-footer>
    </main>

    <script src="scripts/news-data.js"></script>
    <script src="scripts/news-render.js"></script>
    <script src="scripts/application-cards.js"></script>
    <script src="scripts/hero-intro.js"></script>
    <script src="scripts/script.js"></script>
  </body>
</html>
