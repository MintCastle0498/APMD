<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Research – APMD</title>
    <meta name="description" content="APMD Lab" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <script src="scripts/components.js"></script>

    <site-header></site-header>

    <main class="page-container">
      <section class="research-hero">
        <div class="research-hero__image research-hero__image--top" aria-hidden="true"></div>
        <div class="research-hero__image research-hero__image--bottom" aria-hidden="true"></div>

        <div class="research-hero__content" aria-hidden="true">
          <span class="research-hero__node research-hero__node--wave">Wave</span>
          <span class="research-hero__node research-hero__node--structured">Structured<br />Material</span>

          <!-- Single polygon (the exact shape from Arrow.svg, flipped to
               point down) instead of a separately-drawn line + arrowhead
               — those were two distinct primitives with their own
               antialiased edges, which left a visible seam/blotch where
               the round line-cap met the triangular head. One shape has
               no internal join. Drawn twice: solid accent color first
               (the base, fully visible on its own), then the identical
               shape again on top in a black gradient — opaque at the
               seam (this polygon's flat top edge, which sits exactly on
               the seam per styles.css's top: 50%), fading to transparent
               by the tip — so it darkens toward black at the boundary and
               lets its true accent color re-emerge away from it, the same
               curve the photo layers themselves fade on. -->
          <div class="research-hero__arrow research-hero__arrow--down">
            <span class="research-hero__arrow-label">Metamaterial</span>
            <svg class="research-hero__arrow-svg" viewBox="0 0 623.08 635.58" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="research-fade-down" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="635.58">
                  <stop offset="0%" stop-color="#000" stop-opacity="1" />
                  <stop offset="20%" stop-color="#000" stop-opacity="1" />
                  <stop offset="100%" stop-color="#000" stop-opacity="0" />
                </linearGradient>
              </defs>
              <polygon class="research-hero__arrow-base" points="623.08,296.36 311.54,635.58 0,296.36 110.7,296.36 110.7,0 512.38,0 512.38,296.36" />
              <polygon fill="url(#research-fade-down)" points="623.08,296.36 311.54,635.58 0,296.36 110.7,296.36 110.7,0 512.38,0 512.38,296.36" />
            </svg>
          </div>

          <!-- Mirror of the arrow above: the polygon's flat bottom edge
               sits at this box's own bottom edge, which styles.css pins
               to the same seam (bottom: 50%), pointing up instead of
               down. -->
          <div class="research-hero__arrow research-hero__arrow--up">
            <svg class="research-hero__arrow-svg" viewBox="0 0 623.08 635.58" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="research-fade-up" gradientUnits="userSpaceOnUse" x1="0" y1="635.58" x2="0" y2="0">
                  <stop offset="0%" stop-color="#000" stop-opacity="1" />
                  <stop offset="20%" stop-color="#000" stop-opacity="1" />
                  <stop offset="100%" stop-color="#000" stop-opacity="0" />
                </linearGradient>
              </defs>
              <polygon class="research-hero__arrow-base" points="623.08,339.22 311.54,0 0,339.22 110.7,339.22 110.7,635.58 512.38,635.58 512.38,339.22" />
              <polygon fill="url(#research-fade-up)" points="623.08,339.22 311.54,0 0,339.22 110.7,339.22 110.7,635.58 512.38,635.58 512.38,339.22" />
            </svg>
            <span class="research-hero__arrow-label">Nanofabrication</span>
          </div>
        </div>
      </section>

      <section class="research-topics">
        <div class="research-topics__inner">
          <div class="page-title-container">
            <h2 class="page-title">Research<span class="page-title__dot">.</span></h2>
          </div>

          <div class="research-list" data-research-list></div>
        </div>
      </section>

      <site-footer></site-footer>
    </main>

    <script src="scripts/research-data.js"></script>
    <script src="scripts/research-render.js"></script>
    <script src="scripts/script.js"></script>
  </body>
</html>
