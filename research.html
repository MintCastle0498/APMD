<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Research – APMD</title>
    <meta name="description" content="APMD Lab" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <script src="components.js"></script>

    <site-header></site-header>

    <main class="page-container">
      <section class="research-hero">
        <div class="research-hero__diagram">
          <svg viewBox="0 0 620 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <marker id="research-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 Z" fill="currentColor" />
              </marker>
            </defs>
            <path
              class="research-hero__arrow"
              d="M 260 85 Q 90 300 260 500"
              fill="none"
              marker-end="url(#research-arrow)"
            />
            <path
              class="research-hero__arrow"
              d="M 360 500 Q 530 300 360 85"
              fill="none"
              marker-end="url(#research-arrow)"
            />
            <text class="research-hero__arrow-label" x="151" y="300" text-anchor="end">Nanofabrication</text>
            <text class="research-hero__arrow-label" x="469" y="300" text-anchor="start">Metamaterial</text>
            <text class="research-hero__node" x="310" y="50" text-anchor="middle">Wave</text>
            <text class="research-hero__node" x="310" y="564" text-anchor="middle">Structured Material</text>
          </svg>
        </div>
      </section>

      <section class="research-topics">
        <div class="research-topics__inner">
          <div class="page-title-container">
            <h2 class="page-title">Research<span class="page-title__dot">.</span></h2>
          </div>

          <div class="research-list" data-research-list></div>
        </div>
      </section>

      <site-footer></site-footer>
    </main>

    <script src="research-data.js"></script>
    <script src="research-render.js"></script>
    <script src="script.js"></script>
  </body>
</html>
