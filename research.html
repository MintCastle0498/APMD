<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Research – APMD</title>
    <meta name="description" content="APMD Lab" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <script src="scripts/components.js"></script>

    <site-header></site-header>

    <main class="page-container">
      <section class="research-hero">
        <div class="research-hero__image research-hero__image--top" aria-hidden="true"></div>
        <div class="research-hero__image research-hero__image--bottom" aria-hidden="true"></div>
        <div class="research-hero__seam" aria-hidden="true"></div>
        <div class="research-hero__diagram">
          <svg viewBox="0 0 620 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <!-- A <marker>'s content resolves currentColor against its
                   OWN place in the DOM (inside <defs>, under the svg
                   root's gray-6), not the accent-colored <line> that
                   references it, which left the arrowhead a mismatched
                   off-white — styled directly (.research-hero__arrowhead
                   in styles.css) instead of relying on that inheritance. -->
              <marker id="research-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="2.4" markerHeight="2.4" orient="auto-start-reverse">
                <path class="research-hero__arrowhead" d="M0,0 L10,5 L0,10 Z" />
              </marker>
            </defs>
            <!-- Straight in each direction now (was a curved oval loop) —
                 same cycle, just reads as two bold, deliberate strokes
                 instead of a soft swoop. Down = Wave shaped into a
                 Structured Material via Nanofabrication; up = that
                 structure (a Metamaterial) acting back on the wave. -->
            <line
              class="research-hero__arrow"
              x1="165" y1="130" x2="165" y2="450"
              marker-end="url(#research-arrow)"
            />
            <line
              class="research-hero__arrow"
              x1="455" y1="450" x2="455" y2="130"
              marker-end="url(#research-arrow)"
            />
            <text class="research-hero__arrow-label" x="128" y="290" text-anchor="middle" transform="rotate(-90, 128, 290)">Nanofabrication</text>
            <text class="research-hero__arrow-label" x="492" y="290" text-anchor="middle" transform="rotate(-90, 492, 290)">Metamaterial</text>
            <text class="research-hero__node" x="310" y="72" text-anchor="middle">Wave</text>
            <text class="research-hero__node" x="310" y="552" text-anchor="middle">Structured Material</text>
          </svg>
        </div>
      </section>

      <section class="research-topics">
        <div class="research-topics__inner">
          <div class="page-title-container">
            <h2 class="page-title">Research<span class="page-title__dot">.</span></h2>
          </div>

          <div class="research-list" data-research-list></div>
        </div>
      </section>

      <site-footer></site-footer>
    </main>

    <script src="scripts/research-data.js"></script>
    <script src="scripts/research-render.js"></script>
    <script src="scripts/script.js"></script>
  </body>
</html>
