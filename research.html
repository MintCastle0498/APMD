<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Research – APMD</title>
    <meta name="description" content="APMD Lab" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <script src="scripts/components.js"></script>

    <site-header></site-header>

    <main class="page-container">
      <section class="research-hero">
        <div class="research-hero__image research-hero__image--top" aria-hidden="true"></div>
        <div class="research-hero__image research-hero__image--bottom" aria-hidden="true"></div>

        <div class="research-hero__content" aria-hidden="true">
          <span class="research-hero__node research-hero__node--wave">Wave</span>
          <span class="research-hero__node research-hero__node--structured">Structured<br />Material</span>

          <!-- Tail (the plain end, y=8) sits at this box's own top edge,
               which styles.css pins exactly to the seam (top: 50%). The
               arrow is drawn TWICE: first solid accent color (the base,
               always fully visible on its own), then the same shape again
               on top in black at a gradient opacity — opaque right at the
               seam, fading to fully transparent by the tip. That overlay
               is what darkens the arrow toward black near the boundary
               and lets its true accent color re-emerge away from it,
               tracking the same black-at-the-seam fade the photo layers
               themselves use (a plain solid-black arrow disappeared
               entirely against the seam's own near-black backdrop). -->
          <div class="research-hero__arrow research-hero__arrow--down">
            <span class="research-hero__arrow-label">Metamaterial</span>
            <svg class="research-hero__arrow-svg" viewBox="0 0 48 220" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="research-fade-down" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="220">
                  <stop offset="0%" stop-color="#000" stop-opacity="0.95" />
                  <stop offset="100%" stop-color="#000" stop-opacity="0" />
                </linearGradient>
              </defs>
              <line class="research-hero__arrow-base" x1="24" y1="8" x2="24" y2="176" stroke-width="16" stroke-linecap="round" />
              <path class="research-hero__arrow-base" d="M24,212 L4,172 L44,172 Z" />
              <line x1="24" y1="8" x2="24" y2="176" stroke="url(#research-fade-down)" stroke-width="16" stroke-linecap="round" />
              <path fill="url(#research-fade-down)" d="M24,212 L4,172 L44,172 Z" />
            </svg>
          </div>

          <!-- Mirror of the arrow above: tail (y=212) sits at this box's
               own bottom edge, which styles.css pins to the same seam
               (bottom: 50%), growing upward instead of down. -->
          <div class="research-hero__arrow research-hero__arrow--up">
            <svg class="research-hero__arrow-svg" viewBox="0 0 48 220" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="research-fade-up" gradientUnits="userSpaceOnUse" x1="0" y1="220" x2="0" y2="0">
                  <stop offset="0%" stop-color="#000" stop-opacity="0.95" />
                  <stop offset="100%" stop-color="#000" stop-opacity="0" />
                </linearGradient>
              </defs>
              <line class="research-hero__arrow-base" x1="24" y1="212" x2="24" y2="44" stroke-width="16" stroke-linecap="round" />
              <path class="research-hero__arrow-base" d="M24,8 L4,48 L44,48 Z" />
              <line x1="24" y1="212" x2="24" y2="44" stroke="url(#research-fade-up)" stroke-width="16" stroke-linecap="round" />
              <path fill="url(#research-fade-up)" d="M24,8 L4,48 L44,48 Z" />
            </svg>
            <span class="research-hero__arrow-label">Nanofabrication</span>
          </div>
        </div>
      </section>

      <section class="research-topics">
        <div class="research-topics__inner">
          <div class="page-title-container">
            <h2 class="page-title">Research<span class="page-title__dot">.</span></h2>
          </div>

          <div class="research-list" data-research-list></div>
        </div>
      </section>

      <site-footer></site-footer>
    </main>

    <script src="scripts/research-data.js"></script>
    <script src="scripts/research-render.js"></script>
    <script src="scripts/script.js"></script>
  </body>
</html>
